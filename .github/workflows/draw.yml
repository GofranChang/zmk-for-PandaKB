name: Draw ZMK keymaps

on:
  workflow_dispatch:
  push:
    paths:
      - "boards/shields/**/*.keymap"
      - "boards/shields/**/*.dtsi"
      - "boards/shields/**/*.overlay"
      - "miryoku/**/*.h"
      - "miryoku/**/*.dtsi"
      - "config/**/*.json"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "boards/shields/Corne_dongle/Corne_dongle.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"
      west_config_path: "config"
